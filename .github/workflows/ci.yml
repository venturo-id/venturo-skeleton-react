name: CI

on:
  pull_request:
    branches: [production]
    # labeled/unlabeled: the "no-doc-change" label switches check:doc-sync off.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # lint:changed, check:changelog and check:doc-sync compare with the PR base.
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge base needs the history of both branches.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: CLAUDE.md at most 200 lines
        run: |
          lines=$(wc -l < CLAUDE.md)
          echo "CLAUDE.md: $lines lines"
          if [ "$lines" -gt 200 ]; then
            echo "::error file=CLAUDE.md::CLAUDE.md has $lines lines (max 200); move details to docs/ or .claude/rules/"
            exit 1
          fi

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint changed files
        run: yarn lint:changed

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: CHANGELOG
        run: yarn check:changelog

      - name: Doc sync
        env:
          DOC_SYNC_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'no-doc-change') }}
        run: yarn check:doc-sync
